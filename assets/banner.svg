<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Grid pattern (subtle) -->
  <g opacity="0.05" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Title -->
  <text x="60" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">
    Synthetic AI Image Detector
  </text>
  <text x="60" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#06b6d4">
    (SAI)
  </text>

  <!-- Subtitle -->
  <text x="60" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Multi-signal detection with calibration, uncertainty, and cross-generator eval
  </text>

  <!-- Badges row -->
  <g transform="translate(60, 215)">
    <!-- Python badge -->
    <rect x="0" y="0" width="90" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="45" y="18" font-family="monospace" font-size="12" fill="#06b6d4" text-anchor="middle">Python 3.9+</text>

    <!-- License badge -->
    <rect x="100" y="0" width="70" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="135" y="18" font-family="monospace" font-size="12" fill="#3b82f6" text-anchor="middle">MIT</text>

    <!-- No GPU badge -->
    <rect x="180" y="0" width="110" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="235" y="18" font-family="monospace" font-size="12" fill="#8b5cf6" text-anchor="middle">CPU-only</text>

    <!-- Eval badge -->
    <rect x="300" y="0" width="130" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="365" y="18" font-family="monospace" font-size="12" fill="#10b981" text-anchor="middle">GenImage tested</text>
  </g>

  <!-- Author -->
  <text x="60" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748b">
    Sai Likhith Kanuparthi - Senior AI Infrastructure &amp; Systems Engineer
  </text>
  <text x="60" y="300" font-family="monospace" font-size="12" fill="#475569">
    github.com/sailikhithk  |  linkedin.com/in/sailikhithk  |  sailikhith.me
  </text>

  <!-- Right-side signal visualization -->
  <g transform="translate(900, 60)" opacity="0.8">
    <!-- Frequency signal icon -->
    <circle cx="40" cy="40" r="35" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <path d="M 15 40 Q 25 20, 35 40 T 55 40 T 65 40" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="40" y="90" font-family="monospace" font-size="10" fill="#06b6d4" text-anchor="middle">freq</text>

    <!-- Reconstruction signal icon -->
    <circle cx="40" cy="130" r="35" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <rect x="25" y="115" width="30" height="30" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="40" y="180" font-family="monospace" font-size="10" fill="#3b82f6" text-anchor="middle">recon</text>

    <!-- Noise signal icon -->
    <circle cx="40" cy="220" r="35" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <g fill="#8b5cf6">
      <circle cx="30" cy="210" r="2"/>
      <circle cx="45" cy="215" r="2"/>
      <circle cx="35" cy="225" r="2"/>
      <circle cx="50" cy="230" r="2"/>
      <circle cx="25" cy="235" r="2"/>
    </g>
    <text x="40" y="270" font-family="monospace" font-size="10" fill="#8b5cf6" text-anchor="middle">noise</text>
  </g>
</svg>
