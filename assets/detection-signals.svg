<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 545" width="100%" height="auto" role="img" aria-label="Synthetic image detection signals: frequency artifacts, spatial fingerprints, noise residuals, and semantic inconsistencies">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .title { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    .card-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
    .card-desc { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; fill: #475569; }
    .bullet { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; }
    .best-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .best-text { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    .number { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 15px; font-weight: 700; }
    .inner { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f1f5f9; }
      .subtitle { fill: #94a3b8; }
      .card-label { fill: #e2e8f0; }
      .card-desc { fill: #cbd5e1; }
      .bullet { fill: #cbd5e1; }
      .best-label { fill: #e2e8f0; }
      .best-text { fill: #cbd5e1; }
      .inner { fill: #cbd5e1; }
    }
  </style>

  <text x="550" y="32" class="title">SAI Detection Signals</text>
  <text x="550" y="52" class="subtitle">4 artifact families that expose AI-generated images</text>

  <!-- Card 1: Frequency -->
  <rect x="40" y="75" width="240" height="470" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="64" cy="108" r="13" fill="#22c55e"/>
  <text x="64" y="113" class="number" fill="#fff" text-anchor="middle">1</text>
  <text x="88" y="113" class="card-label">Frequency</text>
  <text x="58" y="140" class="card-desc">DCT and FFT reveal up-sampling,
    <tspan x="58" dy="15">checkerboard, and aliasing artifacts.</tspan>
  </text>

  <rect x="58" y="175" width="204" height="110" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <g transform="translate(58, 175)">
    <text x="102" y="20" class="inner" style="font-size:11px; font-weight:600; fill:#15803d">DCT spectrum</text>
    <line x1="30" y1="70" x2="35" y2="50" stroke="#22c55e" stroke-width="2"/>
    <line x1="50" y1="70" x2="55" y2="45" stroke="#22c55e" stroke-width="2"/>
    <line x1="70" y1="70" x2="75" y2="55" stroke="#22c55e" stroke-width="2"/>
    <line x1="90" y1="70" x2="95" y2="48" stroke="#22c55e" stroke-width="2"/>
    <line x1="110" y1="70" x2="115" y2="52" stroke="#22c55e" stroke-width="2"/>
    <line x1="130" y1="70" x2="135" y2="46" stroke="#22c55e" stroke-width="2"/>
    <line x1="150" y1="70" x2="155" y2="58" stroke="#22c55e" stroke-width="2"/>
    <line x1="30" y1="70" x2="175" y2="70" stroke="#22c55e" stroke-width="1"/>
    <text x="102" y="95" class="inner" style="font-size:9px; fill:#15803d">spikes at latent grid</text>
  </g>

  <text x="58" y="313" class="bullet">• Catches GAN up-sampling</text>
  <text x="58" y="328" class="bullet">• Fast: single FFT</text>
  <text x="58" y="343" class="bullet">• Weak to modern diffusion</text>

  <rect x="58" y="420" width="204" height="100" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="160" y="442" class="best-label">Best for</text>
  <text x="160" y="462" class="best-text">Detecting older GAN generators</text>
  <text x="160" y="477" class="best-text">and compression traces</text>

  <!-- Card 2: Spatial -->
  <rect x="300" y="75" width="240" height="470" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="324" cy="108" r="13" fill="#3b82f6"/>
  <text x="324" y="113" class="number" fill="#fff" text-anchor="middle">2</text>
  <text x="348" y="113" class="card-label">Spatial</text>
  <text x="318" y="140" class="card-desc">CNN features spot unnatural textures,
    <tspan x="318" dy="15">pupils, and facial anatomy.</tspan>
  </text>

  <rect x="318" y="175" width="204" height="110" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <g transform="translate(318, 175)">
    <text x="102" y="22" class="inner" style="font-size:11px; font-weight:600; fill:#1d4ed8">CNN features</text>
    <circle cx="70" cy="55" r="12" fill="#3b82f6" opacity="0.15"/>
    <circle cx="134" cy="55" r="12" fill="#3b82f6" opacity="0.15"/>
    <line x1="75" y1="55" x2="129" y2="55" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="102" cy="68" r="4" fill="#3b82f6"/>
    <text x="102" y="95" class="inner" style="font-size:9px; fill:#1d4ed8">eye / face regions</text>
  </g>

  <text x="318" y="313" class="bullet">• High accuracy on faces</text>
  <text x="318" y="328" class="bullet">• Needs large training data</text>
  <text x="318" y="343" class="bullet">• Generalizes poorly</text>

  <rect x="318" y="420" width="204" height="100" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="420" y="442" class="best-label">Best for</text>
  <text x="420" y="462" class="best-text">Face, portrait, and human-figure</text>
  <text x="420" y="477" class="best-text">detection with obvious artifacts</text>

  <!-- Card 3: Noise -->
  <rect x="560" y="75" width="240" height="470" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="584" cy="108" r="13" fill="#f59e0b"/>
  <text x="584" y="113" class="number" fill="#fff" text-anchor="middle">3</text>
  <text x="608" y="113" class="card-label">Noise</text>
  <text x="578" y="140" class="card-desc">PRNU and residual noise patterns
    <tspan x="578" dy="15">differ between real sensors and GANs.</tspan>
  </text>

  <rect x="578" y="175" width="204" height="110" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <g transform="translate(578, 175)">
    <text x="102" y="20" class="inner" style="font-size:11px; font-weight:600; fill:#92400e">residual noise</text>
    <circle cx="70" cy="55" r="3" fill="#f59e0b" opacity="0.8"/>
    <circle cx="90" cy="45" r="2.5" fill="#f59e0b" opacity="0.6"/>
    <circle cx="110" cy="60" r="3.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="130" cy="48" r="2" fill="#f59e0b" opacity="0.6"/>
    <circle cx="150" cy="62" r="3" fill="#f59e0b" opacity="0.7"/>
    <text x="102" y="90" class="inner" style="font-size:9px; fill:#92400e">non-Camera PRNU</text>
  </g>

  <text x="578" y="313" class="bullet">• Sensor fingerprint absent</text>
  <text x="578" y="328" class="bullet">• Robust to GAN and diffusion</text>
  <text x="578" y="343" class="bullet">• Needs denoising model</text>

  <rect x="578" y="420" width="204" height="100" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="680" y="442" class="best-label">Best for</text>
  <text x="680" y="462" class="best-text">Images claiming to be from</text>
  <text x="680" y="477" class="best-text">a real camera or device</text>

  <!-- Card 4: Semantic -->
  <rect x="820" y="75" width="240" height="470" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
  <circle cx="844" cy="108" r="13" fill="#ec4899"/>
  <text x="844" y="113" class="number" fill="#fff" text-anchor="middle">4</text>
  <text x="868" y="113" class="card-label">Semantic</text>
  <text x="838" y="140" class="card-desc">VLM checks physics: shadows,
    <tspan x="838" dy="15">reflections, hand anatomy, and text.</tspan>
  </text>

  <rect x="838" y="175" width="204" height="110" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <g transform="translate(838, 175)">
    <text x="102" y="18" class="inner" style="font-size:11px; font-weight:600; fill:#be185d">VLM examiner</text>
    <text x="102" y="42" class="inner" style="font-size:9px">This shadow points</text>
    <text x="102" y="59" class="inner" style="font-size:9px">the wrong way for</text>
    <text x="102" y="76" class="inner" style="font-size:9px">a single light</text>
    <text x="102" y="93" class="inner" style="font-size:9px">source</text>
  </g>

  <text x="838" y="313" class="bullet">• Catches physics errors</text>
  <text x="838" y="328" class="bullet">• Expensive and slow</text>
  <text x="838" y="343" class="bullet">• Interpretable verdicts</text>

  <rect x="838" y="420" width="204" height="100" rx="8" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="940" y="442" class="best-label">Best for</text>
  <text x="940" y="462" class="best-text">High-stakes cases where</text>
  <text x="940" y="477" class="best-text">explainable evidence is required</text>

  <text x="550" y="535" class="subtitle">SAI fuses all 4 signals into a calibrated probability, uncertainty, and verdict.</text>
</svg>