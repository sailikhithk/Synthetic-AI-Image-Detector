<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="auto" role="img" aria-label="Synthetic image detection signals: frequency artifacts, spatial fingerprints, noise residuals, and semantic inconsistencies">
  <style>
    .title { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    .card-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .card-desc { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; fill: #475569; }
    .bullet { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #64748b; }
    .bestfor { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; font-weight: 600; fill: #1e293b; }
    .number { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 16px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f1f5f9; }
      .subtitle { fill: #94a3b8; }
      .card-label { fill: #e2e8f0; }
      .card-desc { fill: #cbd5e1; }
      .bullet { fill: #94a3b8; }
      .bestfor { fill: #e2e8f0; }
    }
  </style>

  <text x="440" y="32" class="title">SAI Detection Signals</text>
  <text x="440" y="52" class="subtitle">4 artifact families that expose AI-generated images</text>

  <!-- Card 1: Frequency -->
  <rect x="20" y="75" width="200" height="380" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <circle cx="70" cy="108" r="15" fill="#22c55e"/>
  <text x="70" y="114" class="number" fill="#fff" text-anchor="middle">1</text>
  <text x="120" y="114" class="card-label" text-anchor="start">Frequency</text>
  <text x="35" y="138" class="card-desc">DCT and FFT reveal up-sampling, checkerboard, and aliasing artifacts.</text>

  <rect x="45" y="160" width="150" height="80" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="120" y="180" class="card-desc" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">DCT spectrum</text>
  <line x1="70" y1="195" x2="80" y2="210" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="85" y1="190" x2="95" y2="210" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="100" y1="205" x2="110" y2="210" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="115" y1="188" x2="125" y2="210" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="130" y1="198" x2="140" y2="210" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="145" y1="185" x2="155" y2="210" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="160" y1="202" x2="170" y2="210" stroke="#22c55e" stroke-width="1.5"/>
  <text x="120" y="228" class="card-desc" text-anchor="middle" font-size="9" fill="#15803d">spikes at latent grid</text>

  <text x="35" y="280" class="bullet">• Catches GAN up-sampling</text>
  <text x="35" y="300" class="bullet">• Fast: single FFT</text>
  <text x="35" y="320" class="bullet">• Weak to modern diffusion</text>

  <rect x="35" y="350" width="170" height="80" rx="6" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="120" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="120" y="390" class="bullet" text-anchor="middle">Detecting older GAN</text>
  <text x="120" y="405" class="bullet" text-anchor="middle">generators and</text>
  <text x="120" y="420" class="bullet" text-anchor="middle">compression traces</text>

  <!-- Card 2: Spatial -->
  <rect x="230" y="75" width="200" height="380" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="280" cy="108" r="15" fill="#3b82f6"/>
  <text x="280" y="114" class="number" fill="#fff" text-anchor="middle">2</text>
  <text x="330" y="114" class="card-label" text-anchor="start">Spatial</text>
  <text x="245" y="138" class="card-desc">CNN features spot unnatural textures, pupil reflections, and anatomy.</text>

  <rect x="255" y="160" width="150" height="80" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <circle cx="305" cy="195" r="12" fill="#3b82f6" opacity="0.15"/>
  <circle cx="355" cy="195" r="12" fill="#3b82f6" opacity="0.15"/>
  <line x1="305" y1="185" x2="355" y2="185" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="330" cy="205" r="4" fill="#3b82f6"/>
  <text x="330" y="228" class="card-desc" text-anchor="middle" font-size="9" fill="#1d4ed8">eye / face regions</text>

  <text x="245" y="280" class="bullet">• High accuracy on faces</text>
  <text x="245" y="300" class="bullet">• Needs large training data</text>
  <text x="245" y="320" class="bullet">• Generalizes poorly</text>

  <rect x="245" y="350" width="170" height="80" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="330" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="330" y="390" class="bullet" text-anchor="middle">Face, portrait, and</text>
  <text x="330" y="405" class="bullet" text-anchor="middle">human-figure detection</text>
  <text x="330" y="420" class="bullet" text-anchor="middle">(the visual obvious cases)</text>

  <!-- Card 3: Noise -->
  <rect x="440" y="75" width="200" height="380" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="490" cy="108" r="15" fill="#f59e0b"/>
  <text x="490" y="114" class="number" fill="#fff" text-anchor="middle">3</text>
  <text x="540" y="114" class="card-label" text-anchor="start">Noise</text>
  <text x="455" y="138" class="card-desc">PRNU and residual noise patterns differ between real sensors and GANs.</text>

  <rect x="465" y="160" width="150" height="80" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="540" y="180" class="card-desc" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">residual noise</text>
  <circle cx="510" cy="200" r="3" fill="#f59e0b"/>
  <circle cx="525" cy="210" r="2.5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="545" cy="195" r="3.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="560" cy="205" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="575" cy="215" r="3" fill="#f59e0b" opacity="0.7"/>
  <text x="540" y="230" class="card-desc" text-anchor="middle" font-size="9" fill="#92400e">non-Camera PRNU</text>

  <text x="455" y="280" class="bullet">• Sensor fingerprint absent</text>
  <text x="455" y="300" class="bullet">• Robust to GAN / diffusion</text>
  <text x="455" y="320" class="bullet">• Needs denoising model</text>

  <rect x="455" y="350" width="170" height="80" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="540" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="540" y="390" class="bullet" text-anchor="middle">Images claiming to</text>
  <text x="540" y="405" class="bullet" text-anchor="middle">be from a real</text>
  <text x="540" y="420" class="bullet" text-anchor="middle">camera / device</text>

  <!-- Card 4: Semantic -->
  <rect x="650" y="75" width="200" height="380" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <circle cx="700" cy="108" r="15" fill="#ec4899"/>
  <text x="700" y="114" class="number" fill="#fff" text-anchor="middle">4</text>
  <text x="750" y="114" class="card-label" text-anchor="start">Semantic</text>
  <text x="665" y="138" class="card-desc">VLM checks physics: shadows, reflections, hand anatomy, text coherence.</text>

  <rect x="675" y="160" width="150" height="80" rx="6" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="750" y="180" class="card-desc" text-anchor="middle" font-size="10" font-weight="600" fill="#be185d">VLM examiner</text>
  <text x="750" y="198" class="card-desc" text-anchor="middle" font-size="9">"This shadow points</text>
  <text x="750" y="213" class="card-desc" text-anchor="middle" font-size="9">the wrong way for</text>
  <text x="750" y="228" class="card-desc" text-anchor="middle" font-size="9">a single light source"</text>

  <text x="665" y="280" class="bullet">• Catches physics errors</text>
  <text x="665" y="300" class="bullet">• Expensive, slow</text>
  <text x="665" y="320" class="bullet">• Interpretable verdicts</text>

  <rect x="665" y="350" width="170" height="80" rx="6" fill="#fce7f3" stroke="#fbcfe8"/>
  <text x="750" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="750" y="390" class="bullet" text-anchor="middle">High-stakes cases</text>
  <text x="750" y="405" class="bullet" text-anchor="middle">where explainable</text>
  <text x="750" y="420" class="bullet" text-anchor="middle">evidence is required</text>

  <text x="440" y="490" class="subtitle">SAI fuses all 4 signals into a calibrated probability, uncertainty estimate, and verdict.</text>
</svg>
